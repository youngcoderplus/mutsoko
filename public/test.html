<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover local finds — Commonplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .purchase-button {
      width: 100%;
      min-height: 34px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      background: #315b46;
      color: white;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .purchase-button:hover { background: #254b38; }
    .buyer-message {
      min-height: 18px;
      margin: 12px 0;
      color: #8b5543;
      font-size: 10px;
    }
    .buyer-message.success { color: #315b46; }
    .buyer-account-link {
      padding: 8px 11px;
      border: 1px solid #e5e8e0;
      border-radius: 7px;
      background: white;
      color: #315b46;
      font-size: 10px;
      font-weight: 700;
    }
    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-photo-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      font-size: 64px;
    }
    .product-card[hidden] { display: none; }
  </style>
</head>
